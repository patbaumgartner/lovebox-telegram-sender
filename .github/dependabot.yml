version: 2
updates:
- package-ecosystem: maven
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "06:00"
    timezone: Europe/Zurich
  open-pull-requests-limit: 10
  reviewers:
  - patbaumgartner
  assignees:
  - patbaumgartner
  commit-message:
    prefix: deps(java)
    include: scope
  labels:
  - dependencies
  - java
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "06:00"
    timezone: Europe/Zurich
  open-pull-requests-limit: 5
  groups:
    # codeql-action/init and codeql-action/analyze must always run the same
    # version; bumped in separate pull requests, the first one merged fails the
    # CodeQL workflow with "Loaded a configuration file for version X, but
    # running version Y".
    codeql-action:
      patterns:
      - github/codeql-action*
  reviewers:
  - patbaumgartner
  assignees:
  - patbaumgartner
  commit-message:
    prefix: ci
    include: scope
  labels:
  - dependencies
  - github-actions
