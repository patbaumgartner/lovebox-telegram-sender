name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  JAVA_VERSION: "25"
  MAVEN_OPTS: "-Xmx1024m -XX:+UseG1GC"

jobs:
  # ── Java / Spring Boot ──────────────────────────────────────────────────────
  java:
    name: Java – Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Check code formatting
        run: ./mvnw spring-javaformat:validate -ntp

      - name: Build, test & verify
        run: ./mvnw clean verify -ntp
        env:
          MAVEN_OPTS: ${{ env.MAVEN_OPTS }}

      # Reporting only; Maven above decides whether the build passes.
      - name: Publish test results
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: always()
        continue-on-error: true
        with:
          name: "Test Results – Java ${{ env.JAVA_VERSION }}"
          path: "target/surefire-reports/*.xml,target/failsafe-reports/TEST-*.xml"
          reporter: java-junit
          fail-on-error: false

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: jacoco-coverage
          path: target/site/jacoco/
          if-no-files-found: warn

  # ── Docker: publish native image as snapshot + latest (main pushes only) ────
  # Runs only on direct pushes to main / manual dispatch (never on PRs or forks,
  # where the Docker Hub secrets are unavailable). Publishes the GraalVM native
  # application image and its run image, each tagged with the current project
  # version (e.g. 0.1.0-SNAPSHOT) and :latest.
  docker:
    name: Docker – Publish snapshot & latest
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [java]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    env:
      MAVEN_OPTS: "-Xmx2048m -XX:+UseG1GC"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve project version
        id: version
        run: echo "version=$(./mvnw -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      # Run image must be pushed before the native build: the buildpack pulls it
      # via runImage/pullPolicy=IF_NOT_PRESENT configured in pom.xml.
      # NOTE: build with `--load` (single image) and push with plain `docker push`.
      # `docker/build-push-action` with `push: true` emits a multi-platform manifest
      # list, which the paketo creator cannot consume as a single linux/amd64 base
      # image ("no suitable export target found: ... does not provide the specified
      # platform (linux/amd64)").
      - name: Build run image (single platform, load into daemon)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.base-cnb
          push: false
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/lovebox-telegram-sender-run:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tag and push run image
        run: |
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/lovebox-telegram-sender-run:${{ steps.version.outputs.version }} ${{ secrets.DOCKERHUB_USERNAME }}/lovebox-telegram-sender-run:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/lovebox-telegram-sender-run:${{ steps.version.outputs.version }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/lovebox-telegram-sender-run:latest

      # -Pnative + BP_NATIVE_IMAGE=true compile a GraalVM native image (x86-64-v2).
      # Built locally first so the render smoke test gates publishing: JPEG JNI
      # decoding and HarfBuzz FFM emoji shaping only fail at runtime in the native
      # image, never at build time or in unit tests.
      - name: Build native image
        run: |
          ./mvnw -B -ntp -Pnative spring-boot:build-image -DskipTests \
            -Dspring-boot.build-image.imageName=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/lovebox-telegram-sender:${{ steps.version.outputs.version }}

      - name: Smoke test native image (render pipeline incl. emoji)
        run: |
          docker run --rm \
            -e LOVEBOX_ENABLED=false \
            -e BOT_ENABLED=false \
            -e RENDER_SMOKE_ENABLED=true \
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/lovebox-telegram-sender:${{ steps.version.outputs.version }} \
            | tee smoke.log
          grep -q "Render smoke test passed" smoke.log

      - name: Publish native image (snapshot & latest)
        run: |
          docker push docker.io/${{ secrets.DOCKERHUB_USERNAME }}/lovebox-telegram-sender:${{ steps.version.outputs.version }}
          docker buildx imagetools create \
            --tag docker.io/${{ secrets.DOCKERHUB_USERNAME }}/lovebox-telegram-sender:latest \
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/lovebox-telegram-sender:${{ steps.version.outputs.version }}
