# ── Infrastructure ───────────────────────────────────────────────────────────
spring.threads.virtual.enabled=true
# Keep the JVM alive: this is a non-web app whose only foreground work is the
# Telegram long-polling loop. Under GraalVM native the polling threads are daemon
# threads, so without a keep-alive the process exits immediately after startup.
spring.main.keep-alive=true

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.patbaumgartner=info
logging.level.org.telegram.telegrambots=info

# ── Lovebox account ──────────────────────────────────────────────────────────
# No credentials are shipped on purpose: the application refuses to start rather
# than pretending to be configured. Supply them via environment variables (see
# .env.example) or, for local development, via
# src/main/resources/application-local.properties. Set lovebox.enabled=false for
# a dry run that renders and echoes images but never calls the Lovebox API.
#
#   lovebox.email=me@example.com
#   lovebox.password=...
#   lovebox.signature=Signature
#   lovebox.device-id=...
#   lovebox.box-id=...
#   lovebox.api-url=https://app-api.loveboxlove.com

# ── Telegram bot (create one via @BotFather) ─────────────────────────────────
# bot.allowed-chat-ids is mandatory: the bot serves only those chats and refuses
# everyone else. Message the bot once and it replies with the chat id to add.
#
#   bot.username=Lovebox_bot
#   bot.token=123456:...
#   bot.allowed-chat-ids=123456789
#   bot.echo-mode=SENDER
