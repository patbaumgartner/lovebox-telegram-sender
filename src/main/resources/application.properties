# ── Infrastructure ───────────────────────────────────────────────────────────
spring.threads.virtual.enabled=true
# Keep the JVM alive: this is a non-web app whose only foreground work is the
# Telegram long-polling loop. Under GraalVM native the polling threads are daemon
# threads, so without a keep-alive the process exits immediately after startup.
spring.main.keep-alive=true

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.patbaumgartner=info
logging.level.org.telegram.telegrambots=info

# ── Lovebox account ──────────────────────────────────────────────────────────
# Setting lovebox.enabled=false disables all Lovebox API calls (dry-run mode).
lovebox.enabled=true
lovebox.email=me@email.com
lovebox.password=changeMe

# ── Lovebox device & box (see README on how to obtain these IDs) ─────────────
lovebox.signature=Signature
lovebox.device-id=42fab8322d8cec91
lovebox.box-id=417a114e58e15a0214cf3612
# Optional override of the Lovebox API endpoint:
#lovebox.api-url=https://app-api.loveboxlove.com

# ── Telegram bot (create one via @BotFather) ─────────────────────────────────
bot.username=Lovebox_bot
bot.token=123456:REPLACE_WITH_YOUR_BOT_TOKEN
